<style>
/* ============ ESTILO GERAL ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1b0b3a;color:#fff;
  font-family:"Trebuchet MS","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
body{position:fixed;inset:0}
.hidden{display:none!important}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ============ MENUS ============ */
#ui{position:absolute;inset:0;display:flex;overflow-y:auto;touch-action:pan-y;z-index:4;
  font-size:clamp(11px,3.7vh,19px);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#ui.menu{background:
  radial-gradient(circle at 15% 20%,rgba(255,95,192,.45),transparent 40%),
  radial-gradient(circle at 85% 15%,rgba(61,240,224,.35),transparent 38%),
  radial-gradient(circle at 70% 90%,rgba(198,240,50,.22),transparent 40%),
  linear-gradient(160deg,#2a0f5e,#5a1a9a 55%,#b0206a)}
#ui.over{background:rgba(24,8,56,.78)}
.screen{margin:auto;width:min(96vw,940px);padding:.7em 1em}
.btn{font:inherit;font-weight:800;border:0;border-radius:999px;padding:.55em 1.3em;margin:.2em;color:#fff;cursor:pointer;
  background:linear-gradient(#ff6ac6,#d81b84);box-shadow:0 .22em 0 #8a0f55,0 .4em .8em rgba(0,0,0,.3)}
.btn:active{transform:translateY(.15em);box-shadow:0 .07em 0 #8a0f55}
.btn.big{font-size:1.35em;padding:.55em 1.8em}
.btn.gold{background:linear-gradient(#ffe27a,#f0a818);color:#5a2d00;box-shadow:0 .22em 0 #a8690a,0 .4em .8em rgba(0,0,0,.3)}
.btn.teal{background:linear-gradient(#5ff3e6,#12a9b5);color:#06323a;box-shadow:0 .22em 0 #0b6b74,0 .4em .8em rgba(0,0,0,.3)}
.btn.ghost{background:rgba(255,255,255,.16);box-shadow:none;border:2px solid rgba(255,255,255,.5)}
.btn[disabled]{filter:grayscale(.8);opacity:.6}
.row{display:flex;align-items:center;justify-content:center;gap:.6em;flex-wrap:wrap}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5em;padding-right:6.5em}
.head h2{margin:0;font-size:1.4em;text-shadow:0 .1em 0 rgba(0,0,0,.3)}
.coins{background:rgba(0,0,0,.3);border-radius:999px;padding:.25em .9em;font-weight:800;color:#ffe27a}
.logo{text-align:center;line-height:1.05;margin-bottom:.3em}
.logo .l1{display:block;font-size:2.7em;font-weight:900;color:#c06bff;paint-order:stroke fill;-webkit-text-stroke:.09em #fff;
  text-shadow:0 .1em 0 #4a148c,0 0 .6em #e2b5ff;letter-spacing:.02em}
.logo .l2{display:block;font-size:1.75em;font-weight:900;color:#ffd84a;text-shadow:0 .09em 0 #a8690a,0 0 .7em rgba(255,226,122,.8)}
.logo .st{color:#ffd84a;-webkit-text-stroke:0;display:inline-block;animation:tw 1.2s infinite alternate}
.logo .st:nth-child(2){animation-delay:.6s}
@keyframes tw{from{transform:scale(.75) rotate(-12deg);opacity:.7}to{transform:scale(1.15) rotate(12deg);opacity:1}}
.welcome{font-size:1.5em;font-weight:900;color:#fff;text-shadow:0 .1em 0 #d81b84;margin:.1em 0 .4em;text-align:center}
.titleRow{display:flex;align-items:center;justify-content:center;gap:1em}
.titleRow canvas{height:min(46vh,230px);width:auto}
.col{display:flex;flex-direction:column;align-items:center}
.grid{display:grid;gap:.6em}
.g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.card{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);border-radius:1em;padding:.5em;text-align:center;
  cursor:pointer;position:relative;backdrop-filter:blur(2px)}
.card:active{transform:scale(.97)}
.card.locked{opacity:.5;filter:grayscale(.6)}
.card.sel{border-color:#ffd84a;background:rgba(255,216,74,.2)}
.card .num{font-size:.8em;opacity:.8}
.card .nm{font-weight:800;font-size:1.02em;line-height:1.15;margin:.15em 0}
.card .ic{font-size:1.8em;line-height:1.1}
.card .sm{font-size:.78em;opacity:.9;line-height:1.2}
.card canvas{height:min(30vh,150px);width:auto;display:block;margin:0 auto}
.stars{color:#ffd84a;letter-spacing:.1em;font-size:1.15em}
.stars i{font-style:normal;opacity:.3}
.daily{margin-top:.6em;display:flex;align-items:center;justify-content:space-between;gap:1em;text-align:left;
  background:linear-gradient(90deg,rgba(255,216,74,.3),rgba(61,240,224,.25))}
.tabs{display:flex;gap:.4em;justify-content:center;margin-bottom:.5em}

.panel{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.4);border-radius:1.2em;padding:.8em 1.2em;text-align:center}
.letter{background:#fff8ee;color:#5a2a5e;border-radius:1em;padding:1em 1.4em;max-width:36em;margin:0 auto;text-align:left;
  border:.25em solid #ffd84a;box-shadow:0 .5em 1.5em rgba(0,0,0,.4);line-height:1.45}
.letter h3{margin:.1em 0 .4em;color:#b0206a;font-size:1.3em}

/* ============ CONTROLES DE TOQUE ============ */
#controls{position:absolute;inset:0;pointer-events:none;z-index:3}
#dpad{position:absolute;left:calc(2.5vw + env(safe-area-inset-left));bottom:calc(5vh + env(safe-area-inset-bottom));
  width:min(48vh,220px);height:min(23vh,104px);display:flex;gap:5%;pointer-events:auto;touch-action:none}
#dpad .arrow{flex:1;border-radius:24%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.6);
  display:flex;align-items:center;justify-content:center;font-size:min(9vh,40px);color:#fff}
#dpad .arrow.on,.cbtn.on{background:rgba(255,255,255,.5)}
.cbtn{position:absolute;width:min(23vh,104px);height:min(23vh,104px);border-radius:50%;pointer-events:auto;touch-action:none;
  display:flex;align-items:center;justify-content:center;font-size:min(10vh,44px);border:2px solid rgba(255,255,255,.7);color:#fff}
#btnJump{right:calc(2.5vw + env(safe-area-inset-right));bottom:calc(5vh + env(safe-area-inset-bottom));background:rgba(61,240,224,.4)}
#btnAtk{right:calc(2.5vw + min(26vh,118px) + env(safe-area-inset-right));bottom:calc(15vh + env(safe-area-inset-bottom));background:rgba(255,95,192,.45)}
#topbar{position:absolute;top:calc(1.5vh + env(safe-area-inset-top));right:calc(1.5vw + env(safe-area-inset-right));display:flex;gap:.5em;z-index:6}
#topbar button{width:min(11vh,44px);height:min(11vh,44px);border-radius:50%;border:2px solid rgba(255,255,255,.7);
  background:rgba(40,10,80,.55);color:#fff;font-size:min(5.5vh,22px);padding:0;cursor:pointer}
#toast{position:absolute;left:50%;bottom:5vh;transform:translateX(-50%);z-index:8;background:linear-gradient(#ffe27a,#f0a818);color:#5a2d00;
  font-weight:800;border-radius:999px;padding:.5em 1.2em;box-shadow:0 .3em 1em rgba(0,0,0,.4);transition:opacity .4s;opacity:0;pointer-events:none;
  font-size:clamp(12px,3.6vh,18px);white-space:nowrap}
#toast.show{opacity:1}

/* ============ AVISO PARA GIRAR ============ */
#rotate{display:none;position:fixed;inset:0;z-index:99;background:linear-gradient(160deg,#2a0f5e,#b0206a);
  flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2em;font-size:5vw;font-weight:800}
#rotate .ph{font-size:22vw;animation:rot 1.6s ease-in-out infinite alternate}
@keyframes rot{from{transform:rotate(0)}to{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:1024px){#rotate{display:flex}}
</style>
</head>

<canvas id="game"></canvas>
<div id="controls" class="hidden">
  <div id="dpad"><div class="arrow" id="aL">◀</div><div class="arrow" id="aR">▶</div></div>

</div>

<script>
'use strict';
/* =====================================================================
   MISSÃO ALYCIA: GUERREIRAS DO POP
   Jogo de plataforma 2D feito com carinho para a Alycia.
   Seções: 1) Utilitários e save  2) Catálogo  3) Áudio  4) Entrada
           5) Desenho  6) Fases  7) Motor do jogo  8) Telas  9) Loop
   ===================================================================== */

/* ============ 1) UTILITÁRIOS E SAVE ============ */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;
const hsh=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}

const SAVE_KEY='missaoAlycia_v1';
function defaultSave(){return{coins:0,totalCoins:0,stars:[0,0,0,0,0,0],done:[0,0,0,0,0,0],
  owned:{outfit:['heroina'],hair:['solto'],weapon:['brilho']},equip:{outfit:'heroina',hair:'solto',weapon:'brilho'},
  ach:{},kills:0,played:{},daily:{last:'',count:0},bosses:{},rhythmPerfect:0,muted:false,letter:false}}
function loadSave(){
  try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s&&typeof s==='object'){const d=defaultSave();
      return Object.assign(d,s,{owned:Object.assign(d.owned,s.owned||{}),equip:Object.assign(d.equip,s.equip||{}),daily:Object.assign(d.daily,s.daily||{})})}
  }catch(e){}
  return defaultSave()}
let save=loadSave();
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}

/* ============ 2) CATÁLOGO: PERSONAGENS, LOJA, CONQUISTAS ============ */
const CHARS={
  alycia:{name:'Alycia',skill:'Pulo duplo e ataque equilibrado',speed:1},
  luna:{name:'Luna',skill:'Voa um pouquinho: segure o pulo no ar',speed:1},
  nara:{name:'Nara',skill:'Corre mais rápido',speed:1.3},
  kira:{name:'Kira',skill:'Ataque em área',speed:1}
};
const SHOP={
  outfit:[{id:'heroina',name:'Heroína do Laço',price:0},{id:'moletom',name:'Moletom de Corações',price:150},
          {id:'vestido',name:'Vestido de Florzinhas',price:220},{id:'dourada',name:'Jaqueta Dourada',price:400}],
  hair:[{id:'solto',name:'Solto',price:0},{id:'coques',name:'Dois Coquinhos',price:100},{id:'meiorabo',name:'Meio Rabo com Presilha',price:100}],
  weapon:[{id:'brilho',name:'Brilho Pop',desc:'Toque mágico de perto',price:0},{id:'espada',name:'Espada de Luz',desc:'Alcança mais e bate forte',price:120},
          {id:'estrela',name:'Estrela Lançável',desc:'Acerta de longe',price:250},{id:'leque',name:'Leque Sonoro',desc:'Três ondas que atravessam',price:380}]
};
const TABS={outfit:'Roupas',hair:'Penteados',weapon:'Armas'};
const LEVEL_INFO=[
  {name:'Parque Neon',desc:'Aprenda a brilhar',icon:'🎡'},
  {name:'Resgate da Música Perdida',desc:'Recupere as notas roubadas',icon:'🎵'},
  {name:'Floresta de Cristais',desc:'Chefão: Gosma Gigante',icon:'💎'},
  {name:'Parque de Diversões Mágico',desc:'Chefão: Palhaço Desafinado',icon:'🎪'},
  {name:'Palco Proibido',desc:'Corra contra o tempo',icon:'⏱️'},
  {name:'Grande Show Final',desc:'Chefão: Rei do Silêncio',icon:'🎤'}
];
const ACH=[
  ['primeira','Primeira Missão','Complete o Parque Neon',s=>s.done[0]],
  ['musica','Música Resgatada','Complete a missão 2',s=>s.done[1]],
  ['gosma','Tchau, Gosma!','Derrote a Gosma Gigante',s=>s.bosses.gosma],
  ['palhaco','Afinou!','Derrote o Palhaço Desafinado',s=>s.bosses.palhaco],
  ['rei','O Show Continua','Derrote o Rei do Silêncio',s=>s.bosses.rei],
  ['estrela3','Brilho Total','Ganhe 3 estrelas em uma missão',s=>s.stars.some(x=>x>=3)],
  ['todas','Superestrela','3 estrelas em todas as missões',s=>s.stars.every(x=>x>=3)],
  ['cacadora','Caça-Monstrinhos','Transforme 50 monstrinhos em brilhos',s=>s.kills>=50],
  ['lenda','Lenda do Pop','Transforme 200 monstrinhos em brilhos',s=>s.kills>=200],
  ['rica','Cofrinho Cheio','Junte 500 moedas no total',s=>s.totalCoins>=500],
  ['estilo','Estilosa','Compre um item na loja',s=>s.owned.outfit.length+s.owned.hair.length+s.owned.weapon.length>3],
  ['closet','Closet Completo','Tenha todas as roupas e penteados',s=>s.owned.outfit.length>=4&&s.owned.hair.length>=3],
  ['amigas','Melhores Amigas','Jogue com Luna, Nara e Kira',s=>s.played.luna&&s.played.nara&&s.played.kira],
  ['diaria','Voltei!','Complete 3 missões diárias',s=>s.daily.count>=3],
  ['ritmo','Ritmo Perfeito','Acerte todas as notas no mini-jogo',s=>s.rhythmPerfect]
];
let toastT=0;
function toast(txt){const el=$('#toast');el.textContent=txt;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2600)}
function checkAch(){let got=false;for(const a of ACH){if(!save.ach[a[0]]&&a[3](save)){save.ach[a[0]]=1;got=true;toast('🏆 Conquista: '+a[1]);AudioSys.sfx('ach')}}if(got)persist()}

/* ============ 3) ÁUDIO (Web Audio API, sem arquivos) ============ */
const NOTE=n=>261.63*Math.pow(2,n/12);
const SONGS={
  menu:{bpm:100,prog:[0,-3,5,7],mel:[0,null,4,null,7,null,4,null,9,null,7,null,4,null,null,null, 0,null,4,null,7,null,12,null,9,null,7,null,null,null,4,null,
        5,null,9,null,12,null,9,null,5,null,9,12,null,9,null,null, 7,null,11,null,14,null,11,null,7,null,null,null,11,null,7,null]},
  level:{bpm:126,prog:[0,7,-3,5],mel:[12,null,12,7,null,9,null,12,null,null,14,null,12,null,9,null, 14,null,14,11,null,7,null,11,null,14,null,16,14,null,null,null,
        12,null,9,12,null,16,null,12,null,9,null,null,12,null,9,null, 9,null,12,null,17,null,16,null,12,null,9,null,7,null,null,null]},
  boss:{bpm:142,prog:[-3,-3,5,4],mel:[9,null,9,12,null,9,null,16,null,null,14,null,12,null,9,null, 9,null,9,12,null,9,null,17,null,16,null,14,12,null,null,null,
        5,null,9,null,12,null,17,null,16,null,12,null,9,null,null,null, 4,null,8,null,11,null,16,null,14,null,11,null,8,null,11,null]},
  party:{bpm:132,prog:[0,5,7,0],mel:[12,null,16,null,19,null,16,19,24,null,null,null,19,null,16,null, 17,null,21,null,24,null,21,null,17,null,21,24,null,21,null,null,
        19,null,23,null,26,null,23,null,19,null,23,null,26,null,23,null, 24,null,19,null,16,null,19,null,24,null,null,null,24,null,null,null]}
};
const AudioSys={ctx:null,master:null,music:null,timer:null,step:0,next:0,song:null,songId:'',
  init(){if(this.ctx)return;try{const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC();
      this.master=this.ctx.createGain();this.master.gain.value=save.muted?0:1;this.master.connect(this.ctx.destination);
      this.music=this.ctx.createGain();this.music.gain.value=.3;this.music.connect(this.master);
      const n=this.ctx.sampleRate*.3,b=this.ctx.createBuffer(1,n,this.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;this.nbuf=b;
    }catch(e){this.ctx=null}},
  resume(){this.init();if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();if(this.ctx&&this.songId&&!this.timer)this.play(this.songId,true)},
  setMute(m){save.muted=m;persist();if(this.master)this.master.gain.value=m?0:1},
  tone(f,dur,type,vol,at,slide,dest){if(!this.ctx)return;const t=at||this.ctx.currentTime;const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(dest||this.master);o.start(t);o.stop(t+dur+.03)},
  noise(dur,vol,at,dest){if(!this.ctx)return;const t=at||this.ctx.currentTime;const s=this.ctx.createBufferSource(),g=this.ctx.createGain();s.buffer=this.nbuf;
    g.gain.setValueAtTime(vol||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(g);g.connect(dest||this.master);s.start(t);s.stop(t+dur+.02)},
  sfx(n){if(!this.ctx)return;const T=this.ctx.currentTime;switch(n){
    case'jump':this.tone(420,.16,'square',.07,T,760);break;
    case'jump2':this.tone(620,.16,'square',.07,T,1040);break;
    case'coin':this.tone(1320,.07,'triangle',.12,T);this.tone(1760,.12,'triangle',.12,T+.06);break;
    case'note':[0,4,7,12].forEach((s,i)=>this.tone(NOTE(12+s),.14,'triangle',.14,T+i*.06));break;
    case'atk':this.noise(.09,.1,T);this.tone(900,.1,'sawtooth',.05,T,300);break;
    case'star':this.tone(1200,.14,'triangle',.09,T,2000);break;
    case'hit':this.tone(300,.1,'square',.1,T,160);break;
    case'pop':this.tone(520,.08,'triangle',.14,T,1100);this.tone(1500,.18,'sine',.1,T+.06,2200);break;
    case'hurt':this.tone(330,.25,'sawtooth',.11,T,110);break;
    case'spring':this.tone(260,.3,'sine',.18,T,1200);break;
    case'power':[0,5,9,12,17].forEach((s,i)=>this.tone(NOTE(s),.12,'square',.07,T+i*.05));break;
    case'cp':[0,7,12].forEach((s,i)=>this.tone(NOTE(12+s),.16,'triangle',.13,T+i*.09));break;
    case'win':[0,4,7,12,16,19,24].forEach((s,i)=>this.tone(NOTE(s),.22,'triangle',.14,T+i*.1));break;
    case'ach':[12,16,19].forEach((s,i)=>this.tone(NOTE(s),.18,'sine',.14,T+i*.08));break;
    case'buy':this.tone(880,.08,'square',.08,T);this.tone(1320,.2,'square',.08,T+.08);break;
    case'no':this.tone(200,.18,'square',.07,T,150);break;
    case'boom':this.noise(.3,.2,T);this.tone(120,.35,'sine',.3,T,40);break;
    case'fw':this.noise(.25,.08,T);this.tone(rnd(600,1400),.3,'sine',.07,T,200);break;
    case'click':this.tone(700,.05,'triangle',.08,T);break;
  }},
  play(id,force){if(this.songId===id&&this.timer&&!force)return;this.songId=id;if(!this.ctx)return;this.stop(true);this.song=SONGS[id];this.step=0;this.next=this.ctx.currentTime+.08;
    this.timer=setInterval(()=>this.tick(),50)},
  stop(keep){if(this.timer){clearInterval(this.timer);this.timer=null}if(!keep)this.songId=''},
  tick(){const c=this.ctx,s=this.song;if(!c||!s||c.state!=='running')return;const sd=60/s.bpm/4;
    if(this.next<c.currentTime-.3)this.next=c.currentTime+.05;
    while(this.next<c.currentTime+.14){const st=this.step%64,bar=Math.floor(st/16),b=st%16,t=this.next,root=s.prog[bar];
      if(b%4===0)this.tone(NOTE(root-24),sd*3.2,'triangle',.3,t,0,this.music);
      if(b%4===2)this.tone(NOTE(root-12),sd*1.4,'triangle',.16,t,0,this.music);
      if(b%8===0)this.tone(150,.12,'sine',.5,t,45,this.music);
      if(b%8===4)this.noise(.09,.16,t,this.music);
      if(b%2===1)this.noise(.03,.05,t,this.music);
      if(b%8===0)[0,4,7].forEach(k=>this.tone(NOTE(root+k+(root+k<-1?12:0)),sd*6,'sine',.05,t,0,this.music));
      const m=s.mel[st];if(m!==null&&m!==undefined)this.tone(NOTE(m),sd*1.8,'square',.075,t,0,this.music);
      this.next+=sd;this.step++}}
};

const keys={},touch={left:false,right:false,jump:false,atk:false},pressed={jump:false,atk:false};
const input={left:false,right:false,jump:false};
addEventListener('keydown',e=>{if(e.repeat)return;keys[e.code]=true;AudioSys.resume();
  if(['Space','ArrowUp','KeyW'].includes(e.code))pressed.jump=true;
  if(['KeyZ','KeyX','KeyJ','Enter'].includes(e.code))pressed.atk=true;
  if(e.code==='Escape'||e.code==='KeyP')togglePause();
  if(G&&G.mode==='rhythm'){const l={ArrowLeft:0,KeyA:0,ArrowDown:1,KeyS:1,ArrowUp:1,ArrowRight:2,KeyD:2}[e.code];if(l!==undefined)rhythmTap(l)}
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
function readInput(){input.left=!!(keys.ArrowLeft||keys.KeyA||touch.left);input.right=!!(keys.ArrowRight||keys.KeyD||touch.right);
  input.jump=!!(keys.Space||keys.ArrowUp||keys.KeyW||touch.jump)}
function bindBtn(el,name){
  const dn=e=>{e.preventDefault();touch[name]=true;pressed[name]=true;el.classList.add('on');AudioSys.resume()};
  const up=e=>{e.preventDefault();touch[name]=false;el.classList.remove('on')};
  el.addEventListener('pointerdown',dn);['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,up))}
function setupTouch(){
  bindBtn($('#btnJump'),'jump');bindBtn($('#btnAtk'),'atk');
  const pad=$('#dpad'),aL=$('#aL'),aR=$('#aR');let pid=null;
  const set=e=>{const r=pad.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2);touch.left=x<-4;touch.right=x>4;aL.classList.toggle('on',touch.left);aR.classList.toggle('on',touch.right)};
  const clr=()=>{pid=null;touch.left=touch.right=false;aL.classList.remove('on');aR.classList.remove('on')};
  pad.addEventListener('pointerdown',e=>{e.preventDefault();pid=e.pointerId;try{pad.setPointerCapture(pid)}catch(_){}set(e);AudioSys.resume()});
  pad.addEventListener('pointermove',e=>{if(e.pointerId===pid){e.preventDefault();set(e)}});
  ['pointerup','pointercancel'].forEach(n=>pad.addEventListener(n,e=>{if(e.pointerId===pid)clr()}));
  document.addEventListener('gesturestart',e=>e.preventDefault());
  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('touchmove',e=>{if(!e.target.closest('#ui'))e.preventDefault()},{passive:false});
}

function drawItem(c,it,t){

    case'spring':{const k=it.sq>0?it.sq*8:0;c.fillStyle='#7a2bd6';rr(c,x-22,y-6,44,6,3);c.fill();c.strokeStyle='#e9e4ff';c.lineWidth=3;c.beginPath();c.moveTo(-14+x,y-6);c.lineTo(x-6,y-12+k/2);c.lineTo(x-14,y-16+k);c.moveTo(x+14,y-6);c.lineTo(x+6,y-12+k/2);c.lineTo(x+14,y-16+k);c.stroke();
      c.fillStyle='#ff5fc0';rr(c,x-24,y-22+k,48,7,3.5);c.fill();c.fillStyle='#ffd84a';circ(c,x-14,y-18.5+k,2);circ(c,x,y-18.5+k,2);circ(c,x+14,y-18.5+k,2);break}
    case'balloon':{const b=Math.sin(t*2.5)*4;[['#ff5fc0',-9,0],['#3df0e0',9,-3],['#ffd84a',0,-12]].forEach(q=>{c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=1;c.beginPath();c.moveTo(x+q[1],y+b+q[2]+10);c.lineTo(x,y+b+26);c.stroke();c.fillStyle=q[0];c.beginPath();c.ellipse(x+q[1],y+b+q[2],9,11,0,0,TAU);c.fill();c.fillStyle='rgba(255,255,255,.5)';circ(c,x+q[1]-3,y+b+q[2]-4,2.2)});break}
    case'scooter':{drawScooter(c,x,y+16,1);c.fillStyle='rgba(255,255,255,.25)';circ(c,x,y,24+Math.sin(t*5)*2);break}
    case'shield':{c.fillStyle='rgba(143,232,255,.35)';circ(c,x,y,17+Math.sin(t*5)*2);c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.arc(x,y,13,0,TAU);c.stroke();c.fillStyle='#ffd84a';sparkle(c,x,y,8,t*2);break}

      c.strokeStyle='#ff5fc0';c.lineWidth=3;c.beginPath();c.arc(x,y-10,36,Math.PI,0);c.stroke();

function LB(theme){return{theme,x:0,gy:380,solids:[],plats:[],items:[],enemies:[],signs:[],arenas:[],
  ground(w,dy){this.gy+=dy||0;this.solids.push({x:this.x,y:this.gy,w,h:700});const s=this.x;this.x+=w;return s},
  gap(w){this.x+=w},
  plat(x,y,w){this.plats.push({x,y,w:w||100,h:16})},
  mover(x,y,w,ax,ay,sp,ph){this.plats.push({x,y,w,h:16,bx:x,by:y,ax,ay,sp:sp||1.2,ph:ph||0,mv:true,dx:0,dy:0})},
  coins(x,y,n,dx){for(let i=0;i<n;i++)this.items.push({t:'coin',x:x+i*(dx||36),y})},
  arc(x,y,n,w,h){for(let i=0;i<n;i++)this.items.push({t:'coin',x:x+i*w/(n-1),y:y-Math.sin(i/(n-1)*Math.PI)*h})},
  col(x,n){for(let i=0;i<n;i++)this.items.push({t:'coin',x,y:this.gy-70-i*45})},
  it(t,x,y){this.items.push({t,x,y:y===undefined?((t==='spring'||t==='cp'||t==='goal')?this.gy:this.gy-40):y})},
  en(t,x,y){this.enemies.push({t,x,y:y===undefined?this.gy:y})},
  sign(x,text){this.signs.push({x,y:this.gy,text})},
  arena(x,w,cfg){this.arenas.push(Object.assign({x,w,gy:this.gy,state:0,wave:0},cfg))},
  // buraco com plataforma que vai e volta
  pitH(w){const x0=this.x,y=this.gy-10;this.gap(w);this.mover(x0+(w-110)/2,y,110,(w-110)/2-26,0,1.05);this.arc(x0+40,y-50,5,w-80,30)},
  // buraco com plataforma que sobe e desce
  pitV(w){const x0=this.x;this.gap(w);this.mover(x0+(w-110)/2,this.gy-20,110,0,55,1.3);this.coins(x0+w/2-32,this.gy-120,3,32)},

}}

/* Missão bônus diária: gerada a partir da data, igual o dia todo e diferente a cada dia. */
function buildDaily(){
  const d=todayStr();let h=7;for(const ch of d)h=(h*31+ch.charCodeAt(0))|0;const r=mulberry(h),ri=n=>Math.floor(r()*n);
  const b=LB(['neon','music','crystal','fair','stage'][ri(5)]),ens=['blob','blob','hop','fly','shooter'];
  let s=b.ground(560);b.sign(s+170,'Missão bônus do dia! Pegue o máximo de brilhos');b.coins(s+280,340,6);
  for(let i=0;i<9;i++){
    const k=ri(6);if(k===3)b.pitH(300);else if(k===4)b.pitV(260);else b.gap(85+ri(25));
    let dy=[-30,0,0,30][ri(4)];if(b.gy+dy>400||b.gy+dy<320)dy=0;
    const w=620+ri(240);s=b.ground(w,dy);const g=b.gy;
    const en=()=>{const t=ens[ri(ens.length)];b.en(t,s+w*.45+ri(Math.floor(w*.35)),t==='fly'?g-60-ri(40):undefined)};
    if(k===0){b.stairs(s+110,3);b.it(ri(2)?'heart':'shield',s+440,g-75-124-34);en()}
    else if(k===1){b.it('spring',s+130);b.col(s+130,5);b.plat(s+230,g-200,130);b.coins(s+262,g-232,3,32);en();en()}
    else if(k===2){b.it(ri(2)?'scooter':'balloon',s+110);b.arc(s+200,g-110,8,w-340,50);en();en();en()}
    else{b.coins(s+80,g-40,Math.floor((w-200)/40),40);en();en()}
    if(i===2||i===5)b.it('cp',s+60);
  }
  b.gap(90);s=b.ground(700);b.coins(s+80,b.gy-40,8,40);b.it('goal',s+540);
  return b.end({daily:true})
}

function updPlayer(dt){

  const max=215*ch.speed*(p.scoot>0?1.55:1),dir=(input.right?1:0)-(input.left?1:0);

  if(p.jbuf>0){
    if(p.coy>0){p.vy=-620;p.coy=0;p.jbuf=0;p.jumps=1;p.onGround=false;p.ground=null;p.spr=false;AudioSys.sfx('jump');burst(p.x,p.y,4,['#fff'],.4)}
    else if(p.balloon>0){p.vy=-300;p.jbuf=0;AudioSys.sfx('jump')}
    else if(p.id==='alycia'&&p.jumps<2){p.vy=-570;p.jumps=2;p.jbuf=0;p.spr=false;AudioSys.sfx('jump2');burst(p.x,p.y,8,['#ff5fc0','#3df0e0','#fff'],.6)}
  }
  let g=1700;if(p.vy<0&&!input.jump&&!p.spr)g=3600;
  if(p.balloon>0)g=p.vy>0?420:900;
  p.vy+=g*dt;if(p.balloon>0&&p.vy>80)p.vy=80;
  if(p.id==='luna'&&!p.onGround&&input.jump&&p.fuel>0&&p.vy>-160&&p.balloon<=0){p.vy=Math.max(p.vy-4200*dt,-160);p.fuel-=dt/1.25;if(Math.random()<.5)G.parts.push({x:p.x,y:p.y,vx:rnd(-40,40),vy:rnd(60,160),life:.4,max:.4,col:pick(['#8ff0c8','#fff']),s:4,g:0,rot:0})}
  if(p.vy>900)p.vy=900;
  // eixo X
  p.x+=p.vx*dt;
  for(const s of G.solids){if(p.x+hw>s.x&&p.x-hw<s.x+s.w&&p.y>s.y+6&&p.y-p.h<s.y+s.h){if(p.x<s.x+s.w/2)p.x=s.x-hw;else p.x=s.x+s.w+hw;p.vx=0}}
  p.x=clamp(p.x,14,G.def.width-14);
  // eixo Y
  const pb=p.y;p.y+=p.vy*dt;p.onGround=false;let gr=null;
  if(p.vy>=0){
    for(const s of G.solids){if(s.wall)continue;if(p.x+hw-3>s.x&&p.x-hw+3<s.x+s.w&&pb<=s.y+8&&p.y>=s.y){p.y=s.y;p.vy=0;p.onGround=true;gr=s}}
    for(const pl of G.plats){if(p.x+hw-3>pl.x&&p.x-hw+3<pl.x+pl.w&&pb<=pl.y-(pl.dy||0)+8&&p.y>=pl.y){p.y=pl.y;p.vy=0;p.onGround=true;gr=pl}}
  }
  p.ground=gr;
  if(p.onGround){p.jumps=0;p.fuel=Math.min(1,p.fuel+dt*2);p.spr=false}
  if(p.y>640){AudioSys.sfx('hurt');respawn()}
  p.state=!p.onGround?(p.vy<0?'jump':'fall'):Math.abs(p.vx)>30?'run':'idle';
  // ataque
  if(pressed.atk&&p.atkCd<=0&&!G.won)doAttack();
  if(G.melee){const m=G.melee;m.t-=dt;const x0=Math.min(p.x-6,p.x+p.face*m.range),x1=Math.max(p.x+6,p.x+p.face*m.range);
    for(const e of G.enemies){if(e.dead||e.lastSw===m.id)continue;if(e.x+e.w/2>x0&&e.x-e.w/2<x1&&e.y>p.y-70&&e.y-e.h<p.y+8){e.lastSw=m.id;damage(e,m.dmg)}}
    for(const s of G.eshots)if(s.x>x0-8&&s.x<x1+8&&s.y>p.y-70&&s.y<p.y+8&&s.k!=='wave'){s.life=0;burst(s.x,s.y,5)}
    if(m.t<=0)G.melee=null}
}

/* ---------- monstrinhos ---------- */
function updEnemies(dt){
  const p=G.p;
  for(const e of G.enemies){
    if(e.dead)continue;if(!e.boss&&Math.abs(e.x-p.x)>1000)continue;
    e.hitT=Math.max(0,e.hitT-dt);e.ph+=dt;if(e.ghost>0)e.ghost-=dt;
    switch(e.t){
      case'blob':case'thief':{const sp=e.t==='thief'?70:45,nx=e.x+e.dir*sp*dt;
        if(!groundAt(nx+e.dir*(e.w/2+3),e.y+8)||wallAt(nx+e.dir*(e.w/2+2),e.y-10))e.dir=-e.dir;else e.x=nx;break}
      case'fly':e.x=e.hx+Math.sin(e.ph*.9)*75;e.y=e.hy+Math.sin(e.ph*2.2)*16;e.dir=Math.cos(e.ph*.9)>0?1:-1;break;
      case'hop':if(e.st==='idle'){e.tm-=dt;e.dir=p.x<e.x?-1:1;if(e.tm<=0){e.st='air';e.vy=-430;e.vx=(clamp(e.x+e.dir*60,e.hx-70,e.hx+70)-e.x)/.573}}
        else{e.vy+=1500*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;if(e.y>=e.hy){e.y=e.hy;e.st='idle';e.tm=.8}}break;
      case'shooter':e.dir=p.x<e.x?-1:1;e.cd-=dt;if(e.cd<=0){e.cd=2.6;if(Math.abs(p.x-e.x)<460&&Math.abs(p.y-e.y)<150&&e.ghost<=0)G.eshots.push({x:e.x+e.dir*14,y:e.y-22,vx:e.dir*135,vy:0,life:3.4,r:9,k:'bubble'})}break;
      default:updBoss(e,dt);
    }
    if(e.dead||e.ghost>0)continue;
    if(overlap(p,e)){
      if(p.scoot>0&&!e.boss){killEnemy(e);continue}
      if(p.vy>100&&(p.y-p.vy*dt)<=e.y-e.h*.45){damage(e,1);p.vy=-430;p.jumps=1;p.spr=true}
      else if(!e.harmless)hurt(e.x)
    }
  }
}
function updBoss(e,dt){

      else if(e.k<1&&e.acc>.4){e.k++;for(const d of[-1,1]){const m=mkEnemy({t:'blob',x:clamp(e.x+d*100,a.x+50,a.x+a.w-50),y:gy});m.arena=a;m.minion=true;m.ghost=.7;m.col='#b9c2d8';G.enemies.push(m);burst(m.x,gy-20,8)}}
      if(e.tm<=0){e.st='hidden';e.tm=half?.6:.9;burst(e.x,gy-60,16,['#e9e4ff','#8fe8ff'])}}
  }
}

function updShots(dt){
  const p=G.p;
  for(const s of G.shots){s.life-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;if(wallAt(s.x,s.y)){s.life=0;continue}
    for(const e of G.enemies){if(e.dead||e.ghost>0)continue;if(s.hit&&s.hit.has(e))continue;if(s.x>e.x-e.w/2-8&&s.x<e.x+e.w/2+8&&s.y>e.y-e.h-12&&s.y<e.y+14){
        if(s.hit){s.hit.add(e);damage(e,s.dmg)}else{damage(e,s.dmg);s.life=0;break}}}}
  G.shots=G.shots.filter(s=>s.life>0);
  for(const s of G.eshots){s.life-=dt;if(s.g)s.vy+=s.g*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
    if(s.k==='sour'&&groundAt(s.x,s.y+6)){s.life=0;burst(s.x,s.y,5,['#b06bff','#c6f032']);continue}
    if(s.k!=='sour'&&wallAt(s.x,s.y)){s.life=0;continue}
    if(Math.abs(s.x-p.x)<12+s.r&&s.y>p.y-p.h-s.r&&s.y<p.y+s.r*.4&&p.inv<=0&&!G.won){s.life=0;hurt(s.x);burst(s.x,s.y,6)}}
  G.eshots=G.eshots.filter(s=>s.life>0);
  for(const f of G.fx)f.t+=dt;G.fx=G.fx.filter(f=>f.t<(f.k==='ring'?.35:.9));
}
function updParts(dt){const a=G.parts;let j=0;for(let i=0;i<a.length;i++){const q=a[i];q.life-=dt;if(q.life<=0)continue;q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.rot+=dt*4;a[j++]=q}a.length=j}
function updCamera(dt){const p=G.p,cam=G.cam,a=G.arena;let lo=0,hi=Math.max(0,G.def.width-VW);
  if(a){if(a.w+80>VW){lo=a.x-40;hi=a.x+a.w+40-VW}else lo=hi=a.x+a.w/2-VW/2}
  const tx=clamp(p.x-VW*.42+p.face*50,lo,hi),ty=VOFF+Math.min(0,p.y-VOFF-190);

/* ---------- mini-jogo de ritmo (missão 2) ---------- */
const RH_TUNE=[0,4,7,4,0,7,4,12,9,7,4,7,0,4,7,12,9,5,9,12,7,4,7,12,14,12,7,12];
function startRhythm(){G.mode='rhythm';showControls(false);AudioSys.stop();const notes=[];let t=0;
  RH_TUNE.forEach((n,i)=>{notes.push({time:t,semi:n,lane:n<=4?0:n<=9?1:2,hit:0});t+=(i%4===3)?.95:.62});
  G.rh={t:-3.2,notes,hits:0,flash:[0,0,0],fb:'',fbT:0,endT:0,end:notes[notes.length-1].time+1.1}}
function rhythmTap(l){const r=G&&G.rh;if(!r||G.mode!=='rhythm'||r.endT>0)return;r.flash[l]=.22;
  const n=r.notes.find(n=>!n.hit&&n.lane===l&&Math.abs(n.time-r.t)<.26);
  if(n){n.hit=1;r.hits++;r.fb=Math.abs(n.time-r.t)<.1?'Perfeito!':'Boa!';r.fbT=.5;AudioSys.tone(NOTE(n.semi+12),.32,'triangle',.22);AudioSys.tone(NOTE(n.semi),.32,'sine',.12)}
  else AudioSys.tone(170,.07,'square',.04)}
function updRhythm(dt){const r=G.rh;r.t+=dt;r.fbT-=dt;for(let i=0;i<3;i++)r.flash[i]=Math.max(0,r.flash[i]-dt);
  for(const n of r.notes)if(!n.hit&&r.t>n.time+.26)n.hit=-1;
  if(r.endT>0){r.endT-=dt;if(r.endT<=0){if(r.pass)complete();else startRhythm()}}
  else if(r.t>r.end){r.pass=r.hits/r.notes.length>=.5;r.endT=r.pass?1.6:2.2;
    if(r.pass){if(r.hits===r.notes.length)save.rhythmPerfect=1;AudioSys.sfx('win');r.fb='A música voltou!'}else{r.fb='Quase! Vamos tentar de novo';AudioSys.sfx('no')}r.fbT=3}}

/* ---------- festa final ---------- */
function startParty(){G.mode='party';G.pt=0;G.fwT=0;showControls(false);AudioSys.play('party')}
function updParty(dt){G.pt+=dt;G.fwT-=dt;if(G.fwT<=0){G.fwT=rnd(.2,.55);const cols=[pick(PCOL),pick(PCOL),'#fff'];const x=G.cam.x+rnd(VW*.08,VW*.92),y=G.cam.y+rnd(40,230);
    for(let i=0;i<34;i++){const a=i/34*TAU,v=rnd(120,230);if(G.parts.length<500)G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.7,1.2),max:1.2,col:pick(cols),s:rnd(3,6),g:120,rot:rnd(6)})}AudioSys.sfx('fw')}
  if(G.pt>2.5&&(pressed.jump||pressed.atk))endParty()}
function endParty(){if(G.mode==='party'&&G.pt>2.5){G.mode='done';complete()}}

/* ---------- fim da fase ---------- */
function finishLevel(){if(G.idx===5&&!G.daily)startParty();else complete()}
function complete(){
  const d=G.def,pct=d.coinsTotal?G.got/d.coinsTotal:1;let stars=1;if(pct>=.6)stars=2;if(pct>=.85&&G.respawns<=2&&!G.timeUps)stars=3;
  let earned=G.coins+stars*10,bonus=0;
  if(G.daily){if(save.daily.last!==todayStr()){save.daily.last=todayStr();save.daily.count++;bonus=50}}
  else{save.done[G.idx]=1;save.stars[G.idx]=Math.max(save.stars[G.idx],stars)}
  earned+=bonus;save.coins+=earned;save.totalCoins+=earned;persist();
  state='menu';showControls(false);AudioSys.play('party');
  showResult({stars,earned,bonus,got:G.got,total:d.coinsTotal,idx:G.idx,daily:G.daily});checkAch()
}

/* ---------- atualização principal ---------- */
function update(dt){
  G.t+=dt;const p=G.p;
  if(G.mode==='rhythm'){updRhythm(dt);updParts(dt);return}
  if(G.mode==='party'){updParty(dt);updParts(dt);return}
  if(G.mode!=='play')return;
  readInput();
  for(const pl of G.plats)if(pl.mv){pl.ph+=dt*pl.sp;const nx=pl.bx+Math.sin(pl.ph)*pl.ax,ny=pl.by+Math.sin(pl.ph)*pl.ay;pl.dx=nx-pl.x;pl.dy=ny-pl.y;pl.x=nx;pl.y=ny;if(p.ground===pl){p.x+=pl.dx;p.y+=pl.dy}}
  updPlayer(dt);updItems(dt);updArenas();updEnemies(dt);updShots(dt);updParts(dt);
  if(G.timer>0&&!G.won){G.timer-=dt;if(G.timer<=0){G.timer=60;G.timeUps++;say('O tempo acabou, mas ganhou +60s. Continue!',3);AudioSys.sfx('no')}}
  if(G.msg){G.msg.t-=dt;if(G.msg.t<=0)G.msg=null}
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*30);
  updCamera(dt);
  if(G.endT>0){G.endT-=dt;if(G.won&&Math.random()<.3)burst(G.cam.x+rnd(VW),G.cam.y+rnd(60,260),6);if(G.endT<=0)finishLevel()}
}

/* ---------- desenho do jogo ---------- */
function outText(c,txt,x,y,px,col,align){c.font=FONT(px);c.textAlign=align||'left';c.lineWidth=Math.max(3,px*.22);c.strokeStyle='rgba(30,8,60,.85)';c.lineJoin='round';c.strokeText(txt,x,y);c.fillStyle=col||'#fff';c.fillText(txt,x,y)}
function wrap(c,text,maxW){const out=[];let line='';for(const w of text.split(' ')){const t=line?line+' '+w:w;if(c.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t}if(line)out.push(line);return out}
function render(){
  const c=ctx,p=G.p,T=G.T,t=G.t;c.setTransform(SC,0,0,SC,0,0);
  drawBackground(c,T,G.cam.x,t,VW,VH);
  c.save();c.translate(-G.cam.x+(G.shake?rnd(-G.shake,G.shake):0),-G.cam.y+(G.shake?rnd(-G.shake,G.shake)*.5:0));
  const x0=G.cam.x-80,x1=G.cam.x+VW+80;
  for(const s of G.solids)if(s.x<x1&&s.x+s.w>x0)drawSolid(c,s,T);
  for(const s of G.signs){if(s.x<x0-120||s.x>x1+120)continue;c.font=FONT(13);if(!s.lines)s.lines=wrap(c,s.text,190);const w=Math.max(...s.lines.map(l=>c.measureText(l).width))+22,h=s.lines.length*17+14,by=s.y-112-h;
    c.fillStyle='#e9e4ff';c.fillRect(s.x-2,by+h,4,s.y-by-h);c.fillStyle='rgba(255,255,255,.93)';rr(c,s.x-w/2,by,w,h,9);c.fill();c.strokeStyle='#b06bff';c.lineWidth=2;c.stroke();
    c.fillStyle='#4a148c';c.textAlign='center';s.lines.forEach((l,i)=>c.fillText(l,s.x,by+21+i*17))}
  for(const pl of G.plats)if(pl.x<x1&&pl.x+pl.w>x0)drawPlat(c,pl,T);
  for(const it of G.items)if(it.x>x0&&it.x<x1)drawItem(c,it,t);
  for(const e of G.enemies){if(e.dead||e.x<x0-60||e.x>x1+60)continue;if(e.ghost>0&&!e.boss)c.globalAlpha=.45+.3*Math.sin(t*30);drawEnemy(c,e,t);c.globalAlpha=1}
  // jogadora
  if(G.mode!=='party'&&!(p.inv>0&&!G.won&&Math.floor(t*16)%2===0)){
    if(p.balloon>0){[['#ff5fc0',-10,0],['#3df0e0',10,-4],['#ffd84a',0,-14]].forEach(q=>{c.strokeStyle='rgba(255,255,255,.7)';c.lineWidth=1;c.beginPath();c.moveTo(p.x+q[1],p.y-88+q[2]);c.lineTo(p.x,p.y-40);c.stroke();c.fillStyle=q[0];c.beginPath();c.ellipse(p.x+q[1],p.y-98+q[2],9,11,0,0,TAU);c.fill()})}
    if(p.scoot>0)drawScooter(c,p.x,p.y,p.face);
    drawGirl(c,p.x,p.y-(p.scoot>0?7:0),1.16,p.face,{id:p.id,outfit:save.equip.outfit,hair:save.equip.hair,t:p.t,state:p.scoot>0?'idle':p.state,atk:p.atkT,hurt:p.hurtT>0});
    if(p.shield){c.strokeStyle='rgba(143,232,255,.9)';c.lineWidth=2.5;c.beginPath();c.arc(p.x,p.y-30,38,0,TAU);c.stroke();c.fillStyle='rgba(143,232,255,.16)';circ(c,p.x,p.y-30,38);c.fillStyle='#fff';for(let k=0;k<4;k++){const a=t*2+k*TAU/4;sparkle(c,p.x+Math.cos(a)*38,p.y-30+Math.sin(a)*38,4,a)}}
    if(p.id==='luna'&&p.fuel<1){c.fillStyle='rgba(0,0,0,.4)';rr(c,p.x-16,p.y-76,32,5,2.5);c.fill();c.fillStyle='#8ff0c8';rr(c,p.x-16,p.y-76,32*Math.max(0,p.fuel),5,2.5);c.fill()}
    if(p.atkT>0){const w=save.equip.weapon,pr=1-p.atkT/.22;c.save();c.translate(p.x,p.y-30);c.scale(p.face,1);
      if(w==='brilho'||w==='espada'){const R=w==='espada'?66:42;c.strokeStyle=w==='espada'?'rgba(61,240,224,.9)':'rgba(255,95,192,.9)';c.lineWidth=(w==='espada'?8:6)*(1-pr)+1.5;c.lineCap='round';c.beginPath();c.arc(4,0,R*(.7+.3*pr),-1.15,-1.15+2.3*pr);c.stroke();
        c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.arc(4,0,R*(.7+.3*pr)-3,-1.15,-1.15+2.3*pr);c.stroke();
        if(w==='espada'){const a=-1.15+2.3*pr;c.strokeStyle='#bafff8';c.lineWidth=4;c.beginPath();c.moveTo(Math.cos(a)*14+4,Math.sin(a)*14);c.lineTo(Math.cos(a)*R+4,Math.sin(a)*R);c.stroke()}
        else{c.fillStyle='#fff';sparkle(c,Math.cos(-1.15+2.3*pr)*40+4,Math.sin(-1.15+2.3*pr)*40,7,t*9)}}
      c.restore()}
  }
  for(const s of G.shots){if(s.k==='star'){c.fillStyle='rgba(255,216,74,.35)';circ(c,s.x-Math.sign(s.vx)*10,s.y,7);c.fillStyle='#ffd84a';star5(c,s.x,s.y,10,t*14);c.fillStyle='#fff';star5(c,s.x,s.y,4,t*14)}
    else{const a=Math.atan2(s.vy,s.vx);c.strokeStyle='rgba(61,240,224,'+clamp(s.life*3,0,1)+')';c.lineWidth=3.5;c.beginPath();c.arc(s.x-Math.cos(a)*14,s.y-Math.sin(a)*14,16,a-.9,a+.9);c.stroke();c.strokeStyle='rgba(255,255,255,'+clamp(s.life*3,0,1)+')';c.lineWidth=1.5;c.beginPath();c.arc(s.x-Math.cos(a)*14,s.y-Math.sin(a)*14,11,a-.8,a+.8);c.stroke()}}
  for(const s of G.eshots){
    if(s.k==='bubble'){c.fillStyle='rgba(199,155,255,.75)';circ(c,s.x,s.y,s.r);c.fillStyle='rgba(255,255,255,.7)';circ(c,s.x-3,s.y-3,2.6)}
    else if(s.k==='sour'){c.fillStyle='#b06bff';circ(c,s.x,s.y,s.r);c.fillStyle='#c6f032';c.font=FONT(14);c.textAlign='center';c.fillText('♪',s.x,s.y+5)}
    else if(s.k==='wave'){c.fillStyle='rgba(255,255,255,.85)';c.beginPath();c.ellipse(s.x,s.y+12,10,20,0,Math.PI,0);c.fill();c.fillStyle='rgba(255,95,192,.7)';c.beginPath();c.ellipse(s.x,s.y+12,5.5,12,0,Math.PI,0);c.fill()}
    else{c.fillStyle='rgba(185,194,216,.9)';circ(c,s.x,s.y,s.r);c.fillStyle='#2b2350';c.font=FONT(11);c.textAlign='center';c.fillText('…',s.x,s.y+2)}}
  for(const f of G.fx){if(f.k==='ring'){c.strokeStyle='rgba(61,240,224,'+(1-f.t/.35)+')';c.lineWidth=6;c.beginPath();c.arc(f.x,f.y,20+f.t/.35*75,0,TAU);c.stroke();c.strokeStyle='rgba(255,255,255,'+(1-f.t/.35)+')';c.lineWidth=2;c.beginPath();c.arc(f.x,f.y,14+f.t/.35*70,0,TAU);c.stroke()}
    else{c.globalAlpha=clamp(1.2-f.t/.9,0,1);outText(c,f.text,f.x,f.y-f.t*40,15,f.col,'center');c.globalAlpha=1}}
  for(const q of G.parts){c.globalAlpha=clamp(q.life/q.max*1.4,0,1);c.fillStyle=q.col;sparkle(c,q.x,q.y,q.s,q.rot)}c.globalAlpha=1;
  c.restore();
  if(G.mode==='rhythm')drawRhythm(c);else if(G.mode==='party'||(G.mode==='done'&&G.idx===5))drawParty(c);else drawHUD(c);
}
function drawHUD(c){
  const p=G.p,t=G.t,sx=14+(window.__safeL||0);
  for(let i=0;i<5;i++){c.fillStyle=i<p.hp?'#ff3b7a':'rgba(255,255,255,.25)';heart(c,sx+10+i*23,20,8)}
  c.fillStyle='#ffd84a';sparkle(c,sx+10,46,9,t);outText(c,''+G.coins,sx+26,52,17,'#ffe27a');
  let y=74;
  if(G.needNotes){outText(c,'♪ '+G.notes+'/'+G.needNotes,sx,y+4,17,'#fff');y+=24}
  const bar=(label,v,col)=>{outText(c,label,sx,y+4,12,'#fff');c.fillStyle='rgba(0,0,0,.4)';rr(c,sx+62,y-6,70,9,4);c.fill();c.fillStyle=col;rr(c,sx+62,y-6,70*clamp(v,0,1),9,4);c.fill();y+=18};
  if(p.scoot>0)bar('Patinete',p.scoot/8,'#3df0e0');if(p.balloon>0)bar('Balões',p.balloon/7,'#ff5fc0');if(p.shield)bar('Escudo',1,'#8fe8ff');
  if(G.timer>0){const s=Math.ceil(G.timer),low=s<=20;outText(c,'⏱ '+Math.floor(s/60)+':'+('0'+s%60).slice(-2),VW/2,30,low?24:20,low&&Math.floor(t*4)%2?'#ff5f7a':'#fff','center')}
  if(G.boss&&!G.boss.dead){const b=G.boss,w=Math.min(260,VW*.4);outText(c,BOSSNAME[b.t],VW/2,G.timer>0?54:24,15,'#fff','center');const by=G.timer>0?60:30;c.fillStyle='rgba(0,0,0,.45)';rr(c,VW/2-w/2,by,w,12,6);c.fill();
    c.fillStyle='#ff5fc0';rr(c,VW/2-w/2,by,w*clamp(b.hp/b.max,0,1),12,6);c.fill();c.strokeStyle='#fff';c.lineWidth=1.5;rr(c,VW/2-w/2,by,w,12,6);c.stroke()}
  else if(G.arena&&G.arena.waves)outText(c,'Onda '+Math.min(G.arena.wave+1,G.arena.waves.length)+'/'+G.arena.waves.length,VW/2,G.timer>0?56:28,15,'#c6f032','center');
  if(t<3.2){c.globalAlpha=clamp(3.2-t,0,1);const nm=G.daily?'Missão Bônus do Dia':'Missão '+(G.idx+1)+': '+LEVEL_INFO[G.idx].name;outText(c,nm,VW/2,VH*.36,26,'#ffd84a','center');c.globalAlpha=1}
  if(G.msg){c.font=FONT(16);const w=c.measureText(G.msg.text).width+30;c.globalAlpha=clamp(G.msg.t*3,0,1);c.fillStyle='rgba(40,10,80,.8)';rr(c,VW/2-w/2,84,w,32,16);c.fill();c.fillStyle='#fff';c.textAlign='center';c.fillText(G.msg.text,VW/2,106);c.globalAlpha=1}
}
function rhGeom(){const lw=Math.min(150,VW/3.6);return{lw,x0:VW/2-lw*1.5,hy:356}}
function drawRhythm(c){
  const r=G.rh,g=rhGeom(),cols=['#ff5fc0','#3df0e0','#c6f032'];
  c.fillStyle='rgba(20,6,50,.72)';c.fillRect(0,0,VW,VH);
  outText(c,'Toque na cor certa quando a nota chegar no círculo!',VW/2,34,16,'#fff','center');
  outText(c,'♪ '+r.hits+'/'+r.notes.length,VW/2,58,16,'#ffd84a','center');
  for(let i=0;i<3;i++){const x=g.x0+i*g.lw;c.fillStyle=i%2?'rgba(255,255,255,.07)':'rgba(255,255,255,.12)';c.fillRect(x+4,70,g.lw-8,VH-70);
    c.fillStyle=cols[i];c.globalAlpha=.25+r.flash[i]*3;circ(c,x+g.lw/2,g.hy,34);c.globalAlpha=1;c.strokeStyle=cols[i];c.lineWidth=5;c.beginPath();c.arc(x+g.lw/2,g.hy,34,0,TAU);c.stroke();
    if(!('ontouchstart' in window))outText(c,['A / ←','S / ↓','D / →'][i],x+g.lw/2,g.hy+62,13,'#fff','center')}
  for(const n of r.notes){const y=g.hy-(n.time-r.t)*190;if(y<60||y>VH+30||n.hit===1)continue;const x=g.x0+n.lane*g.lw+g.lw/2;c.globalAlpha=n.hit===-1?.3:1;c.fillStyle=cols[n.lane];circ(c,x,y,24);c.fillStyle='#fff';circ(c,x,y,17);c.fillStyle='#4a148c';c.font=FONT(22);c.textAlign='center';c.fillText('♪',x,y+8);c.globalAlpha=1}
  if(r.t<0)outText(c,r.t<-2.2?'Prepare-se…':''+Math.ceil(-r.t),VW/2,VH*.5,44,'#ffd84a','center');
  if(r.fbT>0)outText(c,r.fb,VW/2,VH*.42,r.endT>0?30:24,'#fff','center');
}
function drawParty(c){
  const t=G.pt||0,gy=380-G.cam.y,ids=['luna','alycia','nara','kira'];
  c.fillStyle='rgba(20,6,50,.25)';c.fillRect(0,0,VW,VH);
  ids.forEach((id,i)=>{const x=VW/2+(i-1.5)*Math.min(105,VW/5),j=Math.abs(Math.sin(t*4+i*.9))*26;
    drawGirl(c,x,gy-j,id==='alycia'?2.1:1.8,i<2?1:-1,{id,outfit:save.equip.outfit,hair:save.equip.hair,t:t+i,state:'dance'})});
  outText(c,'A música voltou!',VW/2,70,34,'#ffd84a','center');outText(c,'Parabéns, Alycia! ★',VW/2,112,26,'#fff','center');
  if(t>2.5&&Math.floor(t*2)%2)outText(c,'Toque para continuar',VW/2,VH-22,16,'#fff','center');
}

function showResult(r){
  const last=!r.daily&&r.idx===5;
  let h='<div class="screen"><div class="panel"><h2 style="margin:.1em 0">'+(r.daily?'Bônus do dia completo!':last?'Você salvou a música!':'Missão completa!')+'</h2><div class="bigStars">'+starsHTML(r.stars)+'</div>'+
    '<div style="font-size:1.15em;font-weight:800">Brilhos: '+r.got+'/'+r.total+' &nbsp;·&nbsp; <span class="price">+'+r.earned+' moedas 🪙</span></div>'+
    '<div class="sm" style="margin:.4em 0;opacity:.9">'+(r.bonus?'Inclui +50 do bônus diário! ':'')+(r.stars<3?'Dica: pegue mais brilhos e use menos checkpoints para ganhar 3 estrelas.':'Perfeito! Três estrelas!')+'</div><div class="row">';
  if(last)h+='<button class="btn big gold" data-act="letter">💌 Ler a cartinha</button>';
  else if(!r.daily)h+='<button class="btn big gold" data-act="sel" data-v="'+(r.idx+1)+'">Próxima missão ▶</button>';
  h+='<button class="btn teal" data-act="sel" data-v="'+r.idx+'">↻ De novo</button><button class="btn ghost" data-act="map">Mapa</button></div></div></div>';
  setUI(h,'over')}
function showLetter(){G=null;save.letter=true;persist();AudioSys.play('party');
  setUI('<div class="screen"><div class="letter"><h3>💜 Para a Alycia</h3><p>Querida Alycia,</p>'+
    '<p>Você conseguiu! Derrotou o Rei do Silêncio e devolveu a música para o mundo inteiro.</p>'+
    '<p>Este jogo foi feito só para você, com muito carinho, para te lembrar de uma coisa: você é corajosa, criativa e dona do sorriso mais brilhante de todos.</p>'+
    '<p>Continue cantando, dançando e espalhando o seu brilho por onde passar. O palco é todo seu!</p>'+
    '<p><b>Parabéns, minha guerreira do pop!</b></p><p>Com todo o amor do mundo,<br>do seu padrinho ✨</p></div>'+
    '<div class="row" style="margin-top:.8em"><button class="btn gold" data-act="map">Continuar jogando</button><button class="btn ghost" data-act="title">Início</button></div></div>')}
function togglePause(){if(state!=='play'||!G)return;paused=!paused;
  if(paused){showControls(false);setUI('<div class="screen"><div class="panel"><h2 style="margin:.2em 0 .5em">Pausa</h2><div class="col"><button class="btn big gold" data-act="resume">▶ Continuar</button>'+
    '<button class="btn teal" data-act="restart">↻ Recomeçar a fase</button><button class="btn ghost" data-act="map">Sair para o mapa</button></div></div></div>','over')}
  else{setUI(null);showControls(G.mode==='play')}}
const ACT={
  title:showTitle,map:showMap,shop:showShop,ach:showAch,letter:showLetter,
  sel(v){if(v==='daily'){if(!save.done[0]){toast('Complete a Missão 1 primeiro!');AudioSys.sfx('no');return}showCharSel('daily');return}
    const i=+v;if(i>0&&!save.done[i-1]){toast('Complete a missão anterior primeiro!');AudioSys.sfx('no');return}G=null;state='menu';showCharSel(i)},
  start(v){const[i,id]=v.split(':');startLevel(i==='daily'?'daily':+i,id)},
  buy(v){const[tab,id]=v.split(':'),it=SHOP[tab].find(x=>x.id===id);
    if(save.coins<it.price){toast('Faltam '+(it.price-save.coins)+' moedas. Jogue mais missões!');AudioSys.sfx('no');return}
    save.coins-=it.price;save.owned[tab].push(id);save.equip[tab]=id;persist();AudioSys.sfx('buy');toast('Você ganhou: '+it.name+'!');showShop(tab);checkAch()},
  equip(v){const[tab,id]=v.split(':');save.equip[tab]=id;persist();showShop(tab)},
  resume(){if(paused)togglePause()},
  restart(){const i=G.idx,id=G.p.id;startLevel(i,id)}
};
ui.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;AudioSys.resume();AudioSys.sfx('click');const f=ACT[el.dataset.act];if(f)f(el.dataset.v)});
$('#btnPause').addEventListener('click',()=>{AudioSys.resume();togglePause()});
const btnMute=$('#btnMute');btnMute.textContent=save.muted?'🔇':'🔊';
btnMute.addEventListener('click',()=>{AudioSys.resume();AudioSys.setMute(!save.muted);btnMute.textContent=save.muted?'🔇':'🔊'});
cv.addEventListener('pointerdown',e=>{AudioSys.resume();if(!G||paused)return;
  if(G.mode==='rhythm'){const g=rhGeom(),x=e.clientX/innerWidth*VW;rhythmTap(clamp(Math.floor((x-g.x0)/g.lw),0,2))}
  else if(G.mode==='party')endParty()});
/* avatares animados dos menus */
function animateAvatars(t){
  for(const c of ui.querySelectorAll('canvas.av')){const x=c.getContext('2d'),d=c.dataset,w=c.width,h=c.height;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,w,h);
    if(d.weapon){drawWeaponIcon(x,d.weapon,w/2,h/2,h/52,t*1.5);continue}
    if(d.trio){['luna','nara','kira'].forEach((id,i)=>drawGirl(x,w*(.2+i*.3),h*.95-(i===1?0:6),h/74,i===2?-1:1,{id,t:t+i*1.3,state:'idle'}));continue}
    x.fillStyle='rgba(0,0,0,.18)';x.beginPath();x.ellipse(w/2,h*.955,w*.22,h*.022,0,0,TAU);x.fill();
    drawGirl(x,w/2,h*.95,h/72,1,{id:d.id,outfit:d.outfit||save.equip.outfit,hair:d.hair||save.equip.hair,t,state:d.dance?'dance':'idle'})}
}

/* ============ 9) LOOP PRINCIPAL ============ */
let lastTs=0;const mqPortrait=matchMedia('(orientation:portrait) and (max-width:1024px)');
function frame(ts){
  requestAnimationFrame(frame);const dt=Math.min((ts-lastTs)/1000||0,1/30);lastTs=ts;
  if(state==='play'&&!paused&&!mqPortrait.matches&&G)update(dt);
  if(G)render();
  if(!ui.classList.contains('hidden'))animateAvatars(ts/1000);
  pressed.jump=pressed.atk=false;
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='play'&&!paused)togglePause();if(AudioSys.ctx)AudioSys.ctx.suspend()}else if(AudioSys.ctx)AudioSys.ctx.resume()});
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,250));
resize();setupTouch();showTitle();requestAnimationFrame(frame);
</script>
</body>
